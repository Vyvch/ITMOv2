<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Освобождающиеся Домены</title>
    <style>
        :root {
            --bg: #FAFAFA;
            --fg: #222222;
            --border: #DDDDDD;
            --accent: #0070f3;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 2rem;
            line-height: 1.4;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 3px solid var(--fg);
            padding-bottom: 1rem;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 1rem;
            color: #555;
            margin-top: 0.5rem;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .tab {
            padding: 0.5rem 1rem;
            border: 2px solid var(--fg);
            background: transparent;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .tab.active {
            background: var(--fg);
            color: var(--bg);
        }
        .content {
            display: none;
        }
        .content.active {
            display: block;
        }
        
        /* Date Filters */
        .date-filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            background: #FFF;
            cursor: pointer;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .filter-btn.active {
            background: var(--fg);
            color: var(--bg);
            border-color: var(--fg);
        }
        
        /* Grid Layout for Domains */
        .domain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
        }
        .domain-card {
            background: #FFF;
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 4px;
            text-align: center;
        }
        .domain-card .d-name {
            font-weight: bold;
            font-size: 1rem;
            word-break: break-all;
            overflow-wrap: break-word;
        }
        .domain-card .d-date {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.25rem;
        }

        /* Top 20 Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #FFF;
            border: 2px solid var(--fg);
        }
        th, td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #888;
            border-bottom: 2px solid var(--fg);
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .pagination button {
            padding: 0.4rem 0.8rem;
            background: var(--fg);
            color: var(--bg);
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .pagination input {
            width: 50px;
            padding: 0.3rem;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .loader {
            padding: 2rem;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>ДОМЕНЫ</h1>
        <div class="subtitle">Мониторинг освобождающихся доменов .ru, .su, .рф</div>
    </header>
    
    <div class="tabs">
        <button class="tab active" onclick="switchTab('all', event)">Все домены</button>
        <button class="tab" onclick="switchTab('top', event, 'today')">Топ-20 (Сегодня)</button>
        <button class="tab" onclick="switchTab('top', event, 'tomorrow')">Топ-20 (Завтра)</button>
    </div>

    <div id="all" class="content active">
        <div class="date-filters" id="date-filters" style="display:none; align-items: center;">
            <button class="filter-btn active" data-date="all" onclick="toggleFilter('all')">Все дни</button>
            <button class="filter-btn" data-date="today" onclick="toggleFilter('today')">Сегодня</button>
            <button class="filter-btn" data-date="tomorrow" onclick="toggleFilter('tomorrow')">Завтра</button>
            <button class="filter-btn" data-date="dayafter" onclick="toggleFilter('dayafter')">Послезавтра</button>
            
            <input type="text" id="search-input" placeholder="Поиск по имени..." oninput="handleSearch(this.value)" style="margin-left:auto; padding: 0.4rem 0.8rem; border-radius: 20px; border: 1px solid var(--border); outline: none;">
        </div>
        
        <div id="all-loader" class="loader">Получение списка доменов...</div>
        
        <div id="domain-grid" class="domain-grid"></div>
        
        <div id="pagination" class="pagination" style="display:none;">
            <button id="btn-prev" onclick="prevPage()">Назад</button>
            <span>Стр. <input type="number" id="page-input" min="1" value="1" onchange="jumpToPage()"> из <span id="total-pages">1</span></span>
            <button id="btn-next" onclick="nextPage()">Вперед</button>
        </div>
    </div>

    <div id="top" class="content">
        <div id="top-loader" class="loader">ИИ анализирует и запрашивает WHOIS (ожидайте)...</div>
        <table id="top-table" style="display:none;">
            <thead>
                <tr>
                    <th>Домен</th>
                    <th>Обоснование LLM</th>
                    <th>WHOIS Инфо</th>
                </tr>
            </thead>
            <tbody id="top-body"></tbody>
        </table>
    </div>

    <script>
        let allDomains = [];
        let filteredDomains = [];
        let currentPage = 1;
        const perPage = 100;
        let searchQuery = '';
        
        const todayStr = new Date().toISOString().split('T')[0];
        const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];
        const dayAfter = new Date(); dayAfter.setDate(dayAfter.getDate() + 2);
        const dayAfterStr = dayAfter.toISOString().split('T')[0];

        let activeFilters = ['all'];

        function switchTab(tabId, event, param = null) {
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId.split('-')[0] === 'top' ? 'top' : tabId).classList.add('active');
            
            if (tabId === 'top') {
                if (window.currentTopTab !== param) {
                    window.currentTopTab = param;
                    loadTop(param);
                }
            }
        }

        function toggleFilter(filter) {
            if (filter === 'all') {
                activeFilters = ['all'];
            } else {
                activeFilters = activeFilters.filter(f => f !== 'all');
                if (activeFilters.includes(filter)) {
                    activeFilters = activeFilters.filter(f => f !== filter);
                } else {
                    activeFilters.push(filter);
                }
                if (activeFilters.length === 0) activeFilters = ['all'];
            }
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (activeFilters.includes(btn.dataset.date)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            applyFilters();
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            applyFilters();
        }

        function applyFilters() {
            let temp = allDomains;
            
            if (!activeFilters.includes('all')) {
                const targetDates = activeFilters.map(f => {
                    if(f==='today') return todayStr;
                    if(f==='tomorrow') return tomorrowStr;
                    if(f==='dayafter') return dayAfterStr;
                });
                temp = temp.filter(d => targetDates.includes(d.date));
            }
            
            if (searchQuery) {
                temp = temp.filter(d => d.domain.toLowerCase().includes(searchQuery));
            }
            
            filteredDomains = temp;
            currentPage = 1;
            renderDomains();
        }

        function renderDomains() {
            const grid = document.getElementById('domain-grid');
            grid.innerHTML = '';
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageData = filteredDomains.slice(start, end);
            
            pageData.forEach(d => {
                const div = document.createElement('div');
                div.className = 'domain-card';
                div.innerHTML = `<div class="d-name">${d.domain}</div><div class="d-date">${d.date}</div>`;
                grid.appendChild(div);
            });
            
            const totalPages = Math.ceil(filteredDomains.length / perPage) || 1;
            document.getElementById('page-input').value = currentPage;
            document.getElementById('page-input').max = totalPages;
            document.getElementById('total-pages').innerText = totalPages;
            document.getElementById('btn-prev').disabled = currentPage === 1;
            document.getElementById('btn-next').disabled = currentPage === totalPages;
            
            document.getElementById('pagination').style.display = filteredDomains.length > perPage ? 'flex' : 'none';
        }

        function jumpToPage() {
            let val = parseInt(document.getElementById('page-input').value);
            const totalPages = Math.ceil(filteredDomains.length / perPage) || 1;
            if (val >= 1 && val <= totalPages) {
                currentPage = val;
                renderDomains();
            } else {
                document.getElementById('page-input').value = currentPage;
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderDomains();
            }
        }
        function nextPage() {
            if (currentPage * perPage < filteredDomains.length) {
                currentPage++;
                renderDomains();
            }
        }

        async function loadAll() {
            try {
                const res = await fetch('/api/domains');
                allDomains = await res.json();
                document.getElementById('all-loader').style.display = 'none';
                document.getElementById('date-filters').style.display = 'flex';
                applyFilters();
            } catch (e) {
                document.getElementById('all-loader').innerText = 'Ошибка загрузки: ' + e.message;
            }
        }

        async function loadTop(dateType) {
            document.getElementById('top-loader').style.display = 'block';
            document.getElementById('top-table').style.display = 'none';
            const tbody = document.getElementById('top-body');
            tbody.innerHTML = '';
            
            try {
                const res = await fetch(`/api/top?date_type=${dateType}`);
                const data = await res.json();
                
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    let whoisHtml = '';
                    let w;
                    try {
                        w = JSON.parse(item.whois);
                    } catch(e) {
                        w = { raw: item.whois };
                    }
                    
                    if (w.status && typeof w.status === 'string' && w.status.includes('Свободен')) {
                        whoisHtml = `<span style="color: green; font-weight: bold;">✅ ${w.status}</span>`;
                    } else if (w.error) {
                        whoisHtml = `<span style="color: red;">❌ ${w.error}</span>`;
                    } else if (w.creation_date || w.registrar) {
                        whoisHtml = `<strong>Регистратор:</strong> ${w.registrar || '?'}<br>
                                     <strong>Создан:</strong> ${w.creation_date || '?'}<br>
                                     <strong>Истекает:</strong> ${w.expiration_date || '?'}<br>
                                     <small><strong>Статус:</strong> ${w.status || '?'}</small>`;
                    } else {
                        whoisHtml = `<pre style="font-size:0.75rem; overflow-x:auto;">${JSON.stringify(w, null, 2)}</pre>`;
                    }

                    tr.innerHTML = `
                        <td class="domain-name" style="width:25%; word-break: break-all;">
                            ${item.domain}<br>
                            <span style="font-size:0.8rem; font-weight:normal; color:#666;">Дроп: ${item.date}</span>
                        </td>
                        <td style="width:35%; font-size: 0.9rem;">${item.reason}</td>
                        <td style="width:40%;">${whoisHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
                document.getElementById('top-loader').style.display = 'none';
                document.getElementById('top-table').style.display = 'table';
            } catch (e) {
                document.getElementById('top-loader').innerText = 'Ошибка загрузки: ' + e.message;
            }
        }

        loadAll();
    </script>
</body>
</html>
